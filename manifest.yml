modules:
  rovo:agent:
    - key: cprime-demo-environment-agent
      name: Cprime Demo Agent
      description: Orchestrates governed Jira demo environments by checking existing spaces first, then helping users reuse, expand, add volume, delete, or create only when needed.
      prompt: resource:agent;prompts/demo-environment-agent.txt
      conversationStarters:
        - Find existing Banking & Insurance ITSM demo spaces first
        - Give me a short summary of what is happening in project DEMO
        - Create a 30-day trend report for project DEMO
        - Add demo volume to existing Healthcare Scrum projects
        - Plan full SaaS domain coverage without duplicates
      actions:
        - create-overdue-alert-test-issue
        - summarize-project-space
        - find-matching-demo-projects
        - save-demo-project-draft
        - review-saved-demo-project
        - review-demo-environment-request
        - continue-demo-environment-run
        - cancel-demo-environment-run
  action:
    - key: create-overdue-alert-test-issue
      name: Create overdue alert test issue
      function: agent-overdue-test
      actionVerb: CREATE
      description: Creates one issue due yesterday in a Cprime-generated project and assigns it to the requester. Supports project, board, or space wording and requires explicit confirmation.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Existing Cprime-generated Jira demo project key in which to create the test issue.
        summary:
          title: Issue summary
          type: string
          required: false
          description: Optional summary for the test issue. Defaults to Overdue alert automation test.
        confirmed:
          title: Confirm test issue creation
          type: boolean
          required: true
          description: Must be true only after the user explicitly confirms creating one assigned test issue with yesterday as its due date.
    - key: summarize-project-space
      name: Analyze and report on Jira project
      function: agent-summarize-project
      actionVerb: GET
      description: Reads a Jira project the current user can access and returns a live summary, operational report, or trend analysis. Use this when the user asks what is happening, what needs attention, requests a report, or asks about trends in a project or Jira space.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Jira project key to summarize, such as BANK or DEMO. Ask the user for the key when it cannot be inferred safely.
        recentDays:
          title: Recent activity window
          type: integer
          required: false
          description: Number of days used for activity and trends. Defaults to 14 for summaries and 30 for reports or trends; limited to 1 through 90.
        reportType:
          title: Report type
          type: string
          required: false
          description: Use summary for a short snapshot, report for an operational report, or trend for created-versus-completed trend analysis. Defaults to summary.
    - key: find-matching-demo-projects
      name: Find matching existing projects
      function: agent-find-projects
      actionVerb: GET
      description: MUST be called immediately when domain, Jira category, and template are known. Lists matching existing projects and available add-volume, remove-volume, delete-project, or create-new choices before dashboard questions.
      inputs:
        domain:
          title: Domain
          type: string
          required: true
          description: Selected supported business domain.
        spaceCategory:
          title: Jira category
          type: string
          required: true
          description: Jira Service Management, Work Management, Jira Software, or Product Management.
        spaceType:
          title: Template
          type: string
          required: true
          description: Exact selected template, such as ITSM, Scrum, Kanban, Bug Tracking, or Task Tracking.
    - key: save-demo-project-draft
      name: Save demo project draft
      function: agent-save-demo-draft
      actionVerb: CREATE
      description: Saves one immutable project specification after its dashboard choice is known. This does not create Jira resources. Use the returned draftToken for all review and creation calls for this project.
      inputs:
        projectNumber:
          title: Project number
          type: integer
          required: true
          description: Position of this project in the current batch, from 1 through 3.
        request:
          title: Complete project request
          type: string
          required: true
          description: Complete requirements for this project only. Do not include another project's requirements.
        domain:
          title: Domain
          type: string
          required: true
          description: Business domain for this project only.
        spaceCategory:
          title: Jira category
          type: string
          required: true
          description: Jira Service Management, Work Management, Jira Software, or Product Management.
        spaceType:
          title: Template
          type: string
          required: true
          description: Exact sub-category/template for this project, such as ITSM, Scrum, Kanban, or Task Tracking.
        projectManagement:
          title: Project management
          type: string
          required: false
          description: Team-managed or company-managed when applicable.
        dashboardPreference:
          title: Dashboard coverage
          type: string
          required: true
          description: Executive, project-level, both/default, or none.
        dateRange:
          title: Ticket data duration
          type: string
          required: false
          description: Historical data duration, such as 3 months, 6 months, or 1 year.
    - key: review-saved-demo-project
      name: Review saved demo project
      function: agent-review-demo-draft
      actionVerb: GET
      description: Reviews or creates exactly one previously saved project draft. Always use this for projects collected in a multi-project batch so later answers cannot overwrite the saved template.
      inputs:
        draftToken:
          title: Draft token
          type: string
          required: true
          description: Immutable project draft token returned by Save demo project draft.
        decision:
          title: Review decision
          type: string
          required: false
          description: The user's exact response to the existing-project or creation-confirmation question. Leave empty for the initial review.
    - key: review-demo-environment-request
      name: Review demo environment request
      function: agent-create-demo
      actionVerb: GET
      description: Reviews the user's demo request, checks matching existing Jira spaces first, and only prepares creation after the user explicitly chooses add volume, delete, or yes create new.
      inputs:
        request:
          title: User request
          type: string
          required: false
          description: The user's natural-language request, including domain, space type, project type, management style, and any dashboard or volume instructions.
        domain:
          title: Domain
          type: string
          required: false
          description: "Supported business domain: Banking & Insurance, Healthcare, Telecom, Retail & E-Commerce, Manufacturing, Energy & Utilities, SaaS, Public Sector, or Education."
        spaceCategory:
          title: Jira category
          type: string
          required: false
          description: High-level Jira category only. Valid values are Jira Service Management, Work Management, Jira Software, or Product Management. Do not use this for the sub-category/template.
        spaceType:
          title: Sub-category or template
          type: string
          required: false
          description: Requested sub-category/template only, such as ITSM, HRSM, CSM, FSM, LSM, scrum, kanban, bug-tracking, task-tracking, budget-planning, or procurement-management. If the user only says JSM, Work Management, Software, or JPD, pass that as spaceCategory and ask for this field.
        projectManagement:
          title: Project management
          type: string
          required: false
          description: Team-managed or company-managed for scrum and kanban software projects.
        dateRange:
          title: Ticket data duration
          type: string
          required: false
          description: Historical data duration, such as 3 months, 6 months, or 1 year.
        dashboardPreference:
          title: Dashboard/report coverage
          type: string
          required: false
          description: Dashboard/report coverage requested by the user. Valid values include executive, project-level, both/default, or none.
        fullCoverage:
          title: Full domain coverage
          type: boolean
          required: false
          description: True when the user requests Complete Domain, Full Domain, Everything, Enterprise baseline, or one dedicated space per supported type.
        addVolume:
          title: Add volume
          type: boolean
          required: false
          description: True when the user wants to add demo volume to existing domain projects.
        volumeProjectKeys:
          title: Volume project keys
          type: string
          required: false
          description: Comma-separated Jira project keys to receive additional demo volume.
    - key: continue-demo-environment-run
      name: Continue demo environment run
      function: agent-create-demo
      actionVerb: GET
      description: Continues a demo environment creation run that was already approved and started.
      inputs:
        runToken:
          title: Run token
          type: string
          required: true
          description: Continuation token returned by the Create demo environment action.
    - key: cancel-demo-environment-run
      name: Cancel and delete demo run
      function: agent-cancel-demo
      actionVerb: DELETE
      description: Cancels a saved Rovo demo creation run and deletes newly created Jira resources that were recorded in that run.
      inputs:
        runToken:
          title: Run token
          type: string
          required: false
          description: Continuation token returned by the Create demo environment action.
        projectKeys:
          title: Project keys
          type: string
          required: false
          description: Comma-separated Jira project keys to delete when a run token is not available.
        removeVolume:
          title: Remove generated volume only
          type: boolean
          required: false
          description: True to delete only issues generated by the specified run token, optionally limited to projectKeys. Never set this when the user wants to delete the entire Jira project.
  jira:globalPage:
    - key: cprime-demo-agent-page
      resource: main
      resolver:
        function: resolver
      title: Jira Instance - Demo Data Setup
  jira:dashboardGadget:
    - key: cprime-demo-dashboard-gadget
      title: Cprime Demo Gadget
      description: Environment-specific demo dashboard gadget for Cprime demo data.
      thumbnail: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver:
        function: resolver
  jira:projectPage:
    - key: cprime-demo-project-insights
      title: Summary & Reports
      resource: main
      resolver:
        function: resolver
  devops:developmentInfoProvider:
    - key: cprime-demo-github-development-provider
      name:
        value: Cprime Demo GitHub Activity
      homeUrl: https://github.com
      documentationUrl: https://developer.atlassian.com/cloud/jira/software/rest/api-group-development-information/
  devops:deploymentInfoProvider:
    - key: cprime-demo-github-deployment-provider
      name:
        value: Cprime Demo GitHub Deployments
      homeUrl: https://github.com
      documentationUrl: https://developer.atlassian.com/cloud/jira/software/rest/api-group-deployments/
  function:
    - key: resolver
      handler: index.handler
    - key: agent-create-demo
      handler: index.createDemoEnvironmentFromAgent
    - key: agent-find-projects
      handler: index.findMatchingDemoProjectsFromAgent
    - key: agent-summarize-project
      handler: index.summarizeProjectSpaceFromAgent
    - key: agent-overdue-test
      handler: index.createOverdueAlertTestIssueFromAgent
    - key: agent-save-demo-draft
      handler: index.saveDemoProjectDraftFromAgent
    - key: agent-review-demo-draft
      handler: index.reviewSavedDemoProjectFromAgent
    - key: agent-cancel-demo
      handler: index.cancelDemoEnvironmentFromAgent
    - key: agent-demo-run-worker
      handler: index.processAgentDemoRun
    - key: environment-cleanup
      handler: index.scheduledCleanup
    - key: overdue-assignee-alerts
      handler: index.sendOverdueAssigneeAlerts
  consumer:
    - key: agent-demo-run-consumer
      queue: agent-demo-run-queue
      function: agent-demo-run-worker
  scheduledTrigger:
    - key: hourly-overdue-assignee-alerts
      function: overdue-assignee-alerts
      interval: hour
    - key: weekly-environment-cleanup
      function: environment-cleanup
      interval: week
resources:
  - key: main
    path: static/hello-world/build-itsm-required
  - key: agent
    path: resource/agent
app:
  runtime:
    name: nodejs24.x
    memoryMB: 1024
    architecture: arm64
  id: ari:cloud:ecosystem::app/9e6922cc-738c-4223-a182-238b10e76e2c
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:project:jira
    - manage:jira-project
    - manage:jira-configuration
    - read:board-scope:jira-software
    - write:board-scope:jira-software
    - write:sprint:jira-software
    - read:servicedesk-request
    - write:servicedesk-request
    - manage:servicedesk-customer
    - read:space:confluence
    - write:space:confluence
    - read:page:confluence
    - write:page:confluence
    - read:component:compass
    - write:component:compass
    - write:dev-info:jira
    - write:deployment-info:jira
    - read:chat:rovo
    - storage:app
  external:
    fetch:
      backend:
        - address: https://api.openai.com
          inScopeEUD: true
        - address: https://api.github.com
          inScopeEUD: true
        - address: https://*.atlassian.net
          inScopeEUD: true
        - address: https://crawling-ludicrous-target.ngrok-free.dev
          inScopeEUD: true
