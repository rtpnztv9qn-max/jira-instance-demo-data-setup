modules:
  rovo:agent:
    - key: cprime-demo-environment-agent
      name: Cprime Demo Agent
      description: Orchestrates governed Jira demo environments by checking existing spaces first, then helping users reuse, expand, add volume, delete, or create only when needed.
      prompt: resource:agent;prompts/demo-environment-agent.txt
      conversationStarters:
        - Find existing Banking & Insurance ITSM demo spaces first
        - Add demo volume to existing Healthcare Scrum projects
        - Plan full SaaS domain coverage without duplicates
      actions:
        - review-demo-environment-request
        - continue-demo-environment-run
        - cancel-demo-environment-run
  action:
    - key: review-demo-environment-request
      name: Review demo environment request
      function: agent-create-demo
      actionVerb: GET
      description: Reviews the user's demo request, checks matching existing Jira spaces first, and only prepares creation after the user explicitly chooses add volume, delete, or yes create new.
      inputs:
        request:
          title: User request
          type: string
          required: false
          description: The user's natural-language request, including domain, space type, project type, management style, and any dashboard or volume instructions.
        domain:
          title: Domain
          type: string
          required: false
          description: "Supported business domain: Banking & Insurance, Healthcare, Telecom, Retail & E-Commerce, Manufacturing, Energy & Utilities, SaaS, Public Sector, or Education."
        spaceCategory:
          title: Jira category
          type: string
          required: false
          description: High-level Jira category only. Valid values are Jira Service Management, Work Management, Jira Software, or Product Management. Do not use this for the sub-category/template.
        spaceType:
          title: Sub-category or template
          type: string
          required: false
          description: Requested sub-category/template only, such as ITSM, HRSM, CSM, FSM, LSM, scrum, kanban, bug-tracking, task-tracking, budget-planning, or procurement-management. If the user only says JSM, Work Management, Software, or JPD, pass that as spaceCategory and ask for this field.
        projectManagement:
          title: Project management
          type: string
          required: false
          description: Team-managed or company-managed for scrum and kanban software projects.
        dateRange:
          title: Ticket data duration
          type: string
          required: false
          description: Historical data duration, such as 3 months, 6 months, or 1 year.
        dashboardPreference:
          title: Dashboard/report coverage
          type: string
          required: false
          description: Dashboard/report coverage requested by the user. Valid values include executive, project-level, both/default, or none.
        fullCoverage:
          title: Full domain coverage
          type: boolean
          required: false
          description: True when the user requests Complete Domain, Full Domain, Everything, Enterprise baseline, or one dedicated space per supported type.
        addVolume:
          title: Add volume
          type: boolean
          required: false
          description: True when the user wants to add demo volume to existing domain projects.
        volumeProjectKeys:
          title: Volume project keys
          type: string
          required: false
          description: Comma-separated Jira project keys to receive additional demo volume.
    - key: continue-demo-environment-run
      name: Continue demo environment run
      function: agent-create-demo
      actionVerb: GET
      description: Continues a demo environment creation run that was already approved and started.
      inputs:
        runToken:
          title: Run token
          type: string
          required: true
          description: Continuation token returned by the Create demo environment action.
    - key: cancel-demo-environment-run
      name: Cancel and delete demo run
      function: agent-cancel-demo
      actionVerb: DELETE
      description: Cancels a saved Rovo demo creation run and deletes newly created Jira resources that were recorded in that run.
      inputs:
        runToken:
          title: Run token
          type: string
          required: false
          description: Continuation token returned by the Create demo environment action.
        projectKeys:
          title: Project keys
          type: string
          required: false
          description: Comma-separated Jira project keys to delete when a run token is not available.
  jira:globalPage:
    - key: cprime-demo-agent-page
      resource: main
      resolver:
        function: resolver
      title: Jira Instance - Demo Data Setup
  jira:dashboardGadget:
    - key: cprime-demo-dashboard-gadget
      title: Cprime Demo Gadget
      description: Environment-specific demo dashboard gadget for Cprime demo data.
      thumbnail: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      resource: main
      resolver:
        function: resolver
  jira:projectPage:
    - key: cprime-demo-project-insights
      title: Summary & Reports
      resource: main
      resolver:
        function: resolver
  devops:developmentInfoProvider:
    - key: cprime-demo-github-development-provider
      name:
        value: Cprime Demo GitHub Activity
      homeUrl: https://github.com
      documentationUrl: https://developer.atlassian.com/cloud/jira/software/rest/api-group-development-information/
  devops:deploymentInfoProvider:
    - key: cprime-demo-github-deployment-provider
      name:
        value: Cprime Demo GitHub Deployments
      homeUrl: https://github.com
      documentationUrl: https://developer.atlassian.com/cloud/jira/software/rest/api-group-deployments/
  function:
    - key: resolver
      handler: index.handler
    - key: agent-create-demo
      handler: index.createDemoEnvironmentFromAgent
    - key: agent-cancel-demo
      handler: index.cancelDemoEnvironmentFromAgent
    - key: agent-demo-run-worker
      handler: index.processAgentDemoRun
    - key: environment-cleanup
      handler: index.scheduledCleanup
  consumer:
    - key: agent-demo-run-consumer
      queue: agent-demo-run-queue
      function: agent-demo-run-worker
  scheduledTrigger:
    - key: weekly-environment-cleanup
      function: environment-cleanup
      interval: week
resources:
  - key: main
    path: static/hello-world/build-itsm-required
  - key: agent
    path: resource/agent
app:
  runtime:
    name: nodejs24.x
    memoryMB: 1024
    architecture: arm64
  id: ari:cloud:ecosystem::app/9e6922cc-738c-4223-a182-238b10e76e2c
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:project:jira
    - manage:jira-project
    - manage:jira-configuration
    - read:board-scope:jira-software
    - write:board-scope:jira-software
    - write:sprint:jira-software
    - read:servicedesk-request
    - write:servicedesk-request
    - manage:servicedesk-customer
    - read:space:confluence
    - write:space:confluence
    - read:page:confluence
    - write:page:confluence
    - read:component:compass
    - write:component:compass
    - write:dev-info:jira
    - write:deployment-info:jira
    - read:chat:rovo
    - storage:app
  external:
    fetch:
      backend:
        - address: https://api.openai.com
          inScopeEUD: true
        - address: https://api.github.com
          inScopeEUD: true
        - address: https://*.atlassian.net
          inScopeEUD: true
        - address: https://crawling-ludicrous-target.ngrok-free.dev
          inScopeEUD: true
